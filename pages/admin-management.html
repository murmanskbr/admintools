<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="shortcut icon" href="../favicon.svg">
<title>Black Russia — Создание / удаление администратора</title>
<link rel="stylesheet" href="../css/app.css?v=20261010-1200">
</head>
<body data-page="admin-management">
<div id="app"></div>

<script src="../js/api.js?v=20261009-2310"></script>
<script>
(function () {
  "use strict";

  var COOKIE = "br_session";
  var heartbeat = null;

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function normalizeNickname(value) {
    return String(value == null ? "" : value)
      .trim()
      .replace(/_/g, " ")
      .replace(/\s+/g, " ")
      .toLowerCase();
  }

  function cookie(name) {
    var prefix = name + "=";
    var items = document.cookie ? document.cookie.split(";") : [];
    for (var i = 0; i < items.length; i += 1) {
      var item = items[i].trim();
      if (item.indexOf(prefix) === 0) {
        return decodeURIComponent(item.slice(prefix.length));
      }
    }
    return null;
  }

  function clearSession() {
    try { localStorage.removeItem("br_session"); } catch (_) {}
    try { sessionStorage.removeItem("br_session"); } catch (_) {}
    document.cookie = COOKIE + "=; Max-Age=0; Path=/; Secure; SameSite=Lax";
  }

  function readSession() {
    var raw = cookie(COOKIE);

    try {
      if (!raw) raw = sessionStorage.getItem("br_session");
    } catch (_) {}

    try {
      if (!raw) raw = localStorage.getItem("br_session");
    } catch (_) {}

    if (!raw) return null;

    try {
      var session = JSON.parse(raw);
      if (!session || !session.user || !session.user.token) {
        return null;
      }

      var expires = Number(session.expires);
      if (Number.isFinite(expires) && expires <= Date.now()) {
        clearSession();
        return null;
      }

      return session;
    } catch (_) {
      clearSession();
      return null;
    }
  }

  function saveSession(session) {
    var raw = JSON.stringify(session);

    try {
      if (session.remember === true) {
        document.cookie =
          COOKIE + "=" + encodeURIComponent(raw) +
          "; Max-Age=2592000; Path=/; Secure; SameSite=Lax";
        sessionStorage.removeItem("br_session");
      } else {
        sessionStorage.setItem("br_session", raw);
        document.cookie = COOKIE + "=; Max-Age=0; Path=/; Secure; SameSite=Lax";
      }
    } catch (_) {}
  }

  function goLogin() {
    if (heartbeat) clearInterval(heartbeat);
    heartbeat = null;
    clearSession();
    location.replace(new URL("../index.html", location.href).href);
  }


  function renderShell(user) {
    var nickname = String(user.nickname || "BR");
    var role = String(user.role || "");

    if (role !== "management") {
      location.replace(new URL("../pages/dashboard.html", location.href).href);
      return;
    }

    var nav = [
      ["pages/dashboard.html", "⌂", "Главная"],
      ["pages/profile.html", "◉", "Мой профиль"],
      ["pages/access.html", "⚿", "Выдать доступ"],
      ["pages/statistics-all.html", "▥", "Статистика администрации"],
      ["pages/admin-management.html", "♙", "Создание / удаление администратора"],
      ["pages/notifications.html", "!", "Уведомления"],
      ["pages/normatives-all.html", "↑", "Проставка нормативов"],
      ["pages/requests-all.html", "✦", "Обращения администрации"],
      ["pages/game-activity.html", "◉", "Вход в игру"],
      ["pages/logs.html", "◷", "Журнал действий"],
      ["pages/rules.html", "☷", "Регламент"],
      ["pages/settings.html", "⚙", "Настройки"]
    ];

    var current = "admin-management.html";
    var links = nav.map(function (item) {
      var active = item[0].replace("pages/", "") === current ? " active" : "";
      return '<a class="side-link' + active + '" href="../' + item[0] + '">' +
        "<span>" + item[1] + "</span>" + esc(item[2]) + "</a>";
    }).join("");

    document.getElementById("app").innerHTML =
      '<div class="panel">' +
        '<aside class="sidebar" id="sidebar">' +
          '<div class="brand"><img class="brand-logo" src="../favicon.svg" alt="Логотип Black Russia" width="44" height="44"><div><b>BLACK RUSSIA</b><small>Мурманск • Admin Panel</small></div></div>' +
          '<div class="section-title">ПАНЕЛЬ</div>' +
          links.split(nav[8] ? '<a' : '<x')[0] +
          '<div class="section-title">КОНТРОЛЬ</div>' +
          links.substring(
            links.indexOf('<a class="side-link' + (nav[8][0].replace("pages/", "") === current ? " active" : "") + '"')
          ) +
          '<div class="sidebar-bottom">' +
            '<div class="user-mini"><div class="avatar">' +
              esc(nickname.slice(0, 2).toUpperCase()) +
            '</div><div><b>' + esc(nickname) + '</b><small>' +
              esc(user.position || "") + '</small></div></div>' +
            '<button class="logout" id="logout" type="button">Выйти</button>' +
          '</div>' +
        '</aside>' +
        '<div class="mobile-menu-backdrop" id="mobileMenuBackdrop" aria-hidden="true"></div>' +
        '<main class="main">' +
          '<header class="top">' +
            '<button class="mobile-menu" id="mobileMenu" type="button" aria-label="Открыть меню">☰</button>' +
            '<span>АДМИНИСТРАЦИЯ • МУРМАНСК</span>' +
            '<div class="top-right"></div>' +
          '</header>' +
          '<section class="content">' +
            '<div class="head"><h1>Создание / удаление администратора</h1><p>Управление администраторами</p></div>' +
            '<div id="adminContent"></div>' +
          '</section>' +
          '<div class="watermark" aria-hidden="true"><div class="watermark-mark"><img class="watermark-logo" src="../favicon.svg" alt=""><span>' +
            esc(nickname) + '</span><small>BLACK RUSSIA • МУРМАНСК</small></div></div>' +
        '</main>' +
      '</div>';

    function renderMenuLink(item) {
      var active = item[0].replace("pages/", "") === current ? " active" : "";
      var label = esc(item[2]);
      var badge = "";

      if (item[0] === "pages/notifications.html") {
        label = '<span class="side-link-label">' + label + "</span>";
        badge = '<span class="notification-menu-badge" id="notificationMenuBadge" aria-hidden="true"></span>';
      }

      return '<a class="side-link' + active + '" href="../' + item[0] + '"><span>' +
        item[1] + "</span>" + label + badge + "</a>";
    }

    function refreshNotificationBadge() {
      var badge = document.getElementById("notificationMenuBadge");
      if (!badge || !window.BR_API || typeof window.BR_API.notificationsList !== "function") return;

      window.BR_API.notificationsList(user.token)
        .then(function (result) {
          var list = result && Array.isArray(result.notifications) ? result.notifications : [];
          var hasUnread = list.some(function (item) { return !item.is_read; });
          badge.classList.toggle("is-visible", hasUnread);
          badge.setAttribute("aria-hidden", hasUnread ? "false" : "true");
        })
        .catch(function (error) {
          console.warn("[BR AdminTools] Не удалось обновить индикатор уведомлений:", error);
        });
    }

    var notificationBadgeTimer = null;
    function startNotificationBadgePolling() {
      if (notificationBadgeTimer) {
        clearInterval(notificationBadgeTimer);
      }

      notificationBadgeTimer = setInterval(function () {
        if (document.visibilityState === "hidden") return;
        var current = readSession();
        if (!current || !current.user || !current.user.token) return;
        refreshNotificationBadge();
      }, 20000);
    }
    // Replace the combined link list with explicit menu groups.
    var sidebar = document.getElementById("sidebar");
    var groupHtml =
      '<div class="section-title">ПАНЕЛЬ</div>' +
      nav.slice(0, 2).map(function (item) {
        var active = item[0].replace("pages/", "") === current ? " active" : "";
        return renderMenuLink(item);
      }).join("") +
      '<div class="section-title">УПРАВЛЕНИЕ</div>' +
      nav.slice(2, 8).map(function (item) {
        var active = item[0].replace("pages/", "") === current ? " active" : "";
        return renderMenuLink(item);
      }).join("") +
      '<div class="section-title">КОНТРОЛЬ</div>' +
      nav.slice(8, 11).map(function (item) {
        var active = item[0].replace("pages/", "") === current ? " active" : "";
        return renderMenuLink(item);
      }).join("") +
      '<div class="section-title">СИСТЕМА</div>' +
       renderMenuLink(["pages/settings.html", "⚙", "Настройки"]) +
      '<div class="sidebar-bottom">' +
        '<div class="user-mini"><div class="avatar">' + esc(nickname.slice(0, 2).toUpperCase()) +
        '</div><div><b>' + esc(nickname) + '</b><small>' + esc(user.position || "") + '</small></div></div>' +
        '<button class="logout" id="logout" type="button">Выйти</button>' +
      '</div>';
    sidebar.innerHTML =
      '<div class="brand"><img class="brand-logo" src="../favicon.svg" alt="Логотип Black Russia" width="44" height="44"><div><b>BLACK RUSSIA</b><small>Мурманск • Admin Panel</small></div></div>' +
      groupHtml;
    refreshNotificationBadge();
    startNotificationBadgePolling();

    document.documentElement.classList.toggle(
      "theme-light",
      String(user.theme || "dark").toLowerCase() === "light"
    );

    document.getElementById("adminContent").innerHTML =
      '<div class="box"><div class="stats-toolbar-actions">' +
        '<button class="button button-secondary is-active" id="adminCreateTab" type="button">Создать администратора</button>' +
        '<button class="button button-secondary" id="adminDeleteTab" type="button">Удалить администратора</button>' +
      '</div></div>' +

      '<section id="adminCreatePanel">' +
        '<div class="box">' +
          '<div class="page-toolbar"><div><small>ДАННЫЕ</small><b>Создать администратора</b></div>' +
          '<div><span id="adminGoogleCount" class="field-hint">Форма готова</span></div></div>' +
          '<form id="adminCreateForm">' +
            '<div id="adminCreateFields" class="form-grid">' +
              '<div class="field-hint form-full">Загрузка данных…</div>' +
            '</div>' +
            '<div id="adminCreateStatus" class="settings-status" hidden></div>' +
            '<div class="form-actions"><button class="button button-primary" id="adminCreateSubmit" type="submit">Добавить в таблицу</button></div>' +
          '</form>' +
        '</div>' +
      '</section>' +

      '<section id="adminDeletePanel" hidden>' +
        '<div class="box">' +
          '<div class="page-toolbar"><div><small>ДАННЫЕ</small><b>Удалить администратора</b></div></div>' +
          '<form id="adminDeleteForm">' +
            '<div class="form-grid"><div class="form-field form-full"><label>Никнейм администратора</label>' +
            '<input id="adminDeleteNickname" class="form-input" list="adminNicknameList" autocomplete="off" required placeholder="Выберите или введите никнейм">' +
            '<datalist id="adminNicknameList"></datalist>' +
            '<span class="field-hint">Поиск по администраторам. Свою учётную запись удалить нельзя.</span></div></div>' +
            '<div id="adminDeleteStatus" class="settings-status" hidden></div>' +
            '<div class="form-actions"><button class="button button-primary" id="adminDeleteSubmit" type="submit">Удалить администратора</button></div>' +
          '</form>' +
        '</div>' +
      '</section>';

    bindPage(user);
  }

  function bindPage(user) {
    var state = {
      nicknames: [],
      sections: [],
      headers: [
        "Никнейм",
        "Возраст",
        "Доступ с ПК",
        "Должность",
        "Неактивы",
        "Баллы активности",
        "Дни на посту",
        "Страйки",
        "Предупреждения",
        "Баллы",
        "Последнее повышение"
      ]
    };

    var FIELD_ALIASES = {
      nickname: ["никнейм","ник","nickname","nick","логин","login","username"],
      age: ["возраст","age"],
      pc_access: ["доступ с пк","доступ спк","доступ с pc","доступ с пк","pc access","pc_access"],
      position: ["должность","позиция","position","role"],
      inactives: ["неактивы","неактив","inactives","inactive"],
      activity_points: ["баллы активности","активность","activity points","activity_points"],
      post_days: ["дни на посту","дни на уровне","отстоявшие дни на уровне","дни на посту / уровне","post days","post_days"],
      strikes: ["страйки","strikes"],
      warnings: ["предупреждения","преды","предупреждения / преды","warnings","warning"],
      points: ["баллы","points"],
      last_promotion: ["последнее повышение","last promotion","last_promotion"]
    };

    function headerKey(header) {
      var normalized = String(header || "").trim().toLowerCase();
      var keys = Object.keys(FIELD_ALIASES);
      for (var i = 0; i < keys.length; i += 1) {
        if (FIELD_ALIASES[keys[i]].indexOf(normalized) >= 0) return keys[i];
      }
      return "";
    }

    var POSITIONS = [
      "Главный администратор",
      "Заместитель главного администратора",
      "Куратор администрации",
      "Заместитель Куратора администрации",
      "Куратор агентов поддержки",
      "Заместитель Куратора агентов поддержки",
      "Куратор организаций",
      "Заместитель Куратора организаций",
      "Старший администратор",
      "Старший следящий",
      "Администратор",
      "Старший модератор",
      "Модератор",
      "Следящий",
      "Младший модератор"
    ];

    function inputTypeFor(key) {
      if (key === "last_promotion") return "date";
      return ["age","activity_points","post_days","strikes","warnings","points"].indexOf(key) >= 0
        ? "number"
        : "text";
    }

    function renderCreateFields(headers) {
      var root = document.getElementById("adminCreateFields");
      if (!root) return;

      var source = (Array.isArray(headers) ? headers : []).map(function (h) {
        return String(h == null ? "" : h).trim();
      }).filter(Boolean);

      if (!source.length) {
        root.innerHTML =
          '<div class="field-hint form-full">Не удалось определить данные для формы.</div>';
        return;
      }

      root.innerHTML = source.map(function (header, index) {
        var key = headerKey(header);
        var id = "adminField_" + index;
        var type = inputTypeFor(key);
        var required = key === "nickname" || key === "position" ? " required" : "";
        var placeholder = key === "nickname"
          ? "Например: Nikita_Zvezda"
          : key === "position"
            ? "Например: Младший модератор"
            : "";

        var control = key === "position"
          ? '<select id="' + id + '" class="form-select" data-admin-header="' + esc(header) +
            '" data-admin-key="' + esc(key) + '">' +
            '<option value="">Выберите должность</option>' +
            POSITIONS.map(function (position) {
              return '<option value="' + esc(position) + '">' + esc(position) + '</option>';
            }).join("") +
            '</select>'
          : '<input id="' + id + '" class="form-input" data-admin-header="' + esc(header) +
            '" data-admin-key="' + esc(key) + '" type="' + type + '"' + required +
            (type === "number" ? ' min="0"' : "") +
            (placeholder ? ' placeholder="' + esc(placeholder) + '"' : "") +
            '>';

        return '<div class="form-field">' +
          '<label for="' + id + '">' + esc(header) + '</label>' +
          control +
        '</div>';
      }).join("");
    }

    function status(id, message, success) {
      var el = document.getElementById(id);
      if (!el) return;
      el.hidden = !message;
      el.textContent = message || "";
      el.className = "settings-status" + (success ? " is-success" : " is-error");
    }

    function token() {
      var session = readSession();
      if (!session || !session.user || !session.user.token) {
        throw new Error("Сессия истекла. Войдите в панель заново.");
      }
      return session.user.token;
    }

    function renderData(result) {
      var rows = Array.isArray(result && result.rows) ? result.rows : [];
      var headers = Array.isArray(result && result.headers) ? result.headers : state.headers.slice();

      if (headers.length) {
        state.headers = headers.slice();
      }

      renderCreateFields(state.headers);

      var nicknameIndex = state.headers.findIndex(function (h) {
        return ["никнейм","ник","nickname","nick","логин","login","username"]
          .indexOf(String(h || "").trim().toLowerCase()) >= 0;
      });

      state.nicknames = rows.map(function (row) {
        return nicknameIndex >= 0 ? String(row[nicknameIndex] || "").trim() : "";
      }).filter(Boolean);

      var me = normalizeNickname(user.nickname);
      state.nicknames = Array.from(new Set(state.nicknames.filter(function (name) {
        return normalizeNickname(name) !== me;
      }))).sort(function (a, b) {
        return a.localeCompare(b, "ru");
      });

      var list = document.getElementById("adminNicknameList");
      if (list) {
        list.innerHTML = state.nicknames.map(function (name) {
          return '<option value="' + esc(name) + '"></option>';
        }).join("");
      }

      var count = document.getElementById("adminGoogleCount");
      if (count) {
        count.textContent = state.nicknames.length
          ? "Загружено записей: " + state.nicknames.length
          : "Форма готова";
      }
    }

    document.getElementById("adminCreateTab").onclick = function () {
      document.getElementById("adminCreatePanel").hidden = false;
      document.getElementById("adminDeletePanel").hidden = true;
      this.classList.add("is-active");
      document.getElementById("adminDeleteTab").classList.remove("is-active");
    };

    document.getElementById("adminDeleteTab").onclick = function () {
      document.getElementById("adminCreatePanel").hidden = true;
      document.getElementById("adminDeletePanel").hidden = false;
      this.classList.add("is-active");
      document.getElementById("adminCreateTab").classList.remove("is-active");
    };

    document.getElementById("adminCreateForm").onsubmit = async function (event) {
      event.preventDefault();
      var fieldsRoot = document.getElementById("adminCreateFields");
      var controls = fieldsRoot ? fieldsRoot.querySelectorAll("[data-admin-header]") : [];
      var admin = { fields: {} };
      var nickname = "";
      var position = "";

      Array.prototype.forEach.call(controls, function (control) {
        var header = control.getAttribute("data-admin-header") || "";
        var key = control.getAttribute("data-admin-key") || "";
        var value = String(control.value == null ? "" : control.value).trim();

        admin.fields[header] = value;
        if (key) admin[key] = value;

        if (key === "nickname") nickname = value;
        if (key === "position") position = value;
      });

      if (!nickname) {
        status("adminCreateStatus", "Укажите никнейм.", false);
        return;
      }

      if (!position) {
        status("adminCreateStatus", "Укажите должность. По ней система определит нужную группу.", false);
        return;
      }

      if (!window.confirm(
        "Добавить администратора " + nickname +
        " с должностью «" + position + "»?\n\n" +
        "Система автоматически определит нужную группу и добавит администратора."
      )) return;

      var button = document.getElementById("adminCreateSubmit");
            button.disabled = true;
      button.textContent = "Добавление…";

      try {
        var result = await window.BR_API.adminCreateGoogle(token(), {
          auto_section: true,
          admin: admin
        });

        status("adminCreateStatus", "Администратор " + nickname + " добавлен.", true);
        document.getElementById("adminCreateForm").reset();
        renderData(result);
      } catch (error) {
        status("adminCreateStatus", error.message || "Не удалось добавить администратора.", false);
      } finally {
                button.disabled = false;
        button.textContent = "Добавить в таблицу";
      }
    };

    document.getElementById("adminDeleteForm").onsubmit = async function (event) {
      event.preventDefault();

      var nickname = document.getElementById("adminDeleteNickname").value.trim();
      if (!nickname) {
        status("adminDeleteStatus", "Укажите никнейм.", false);
        return;
      }

      if (normalizeNickname(nickname) === normalizeNickname(user.nickname)) {
        status("adminDeleteStatus", "Нельзя удалить самого себя.", false);
        return;
      }

      if (!window.confirm("Вы действительно хотите удалить администратора " + nickname + "?\n\nБудет удалена найденная запись.")) {
        return;
      }

      var button = document.getElementById("adminDeleteSubmit");
            button.disabled = true;
      button.textContent = "Удаление…";

      try {
        var result = await window.BR_API.adminDeleteGoogle(token(), nickname);
        var deleted = Number(result && result.result && result.result.deleted_rows || 0);
        status("adminDeleteStatus", "Администратор " + nickname + " удалён. Строк удалено: " + (deleted || 1) + ".", true);
        document.getElementById("adminDeleteNickname").value = "";
        renderData(result);
      } catch (error) {
        status("adminDeleteStatus", error.message || "Не удалось удалить администратора.", false);
      } finally {
                button.disabled = false;
        button.textContent = "Удалить администратора";
      }
    };

    document.getElementById("logout").onclick = goLogin;

    var mobileMenu = document.getElementById("mobileMenu");
    var sidebar = document.getElementById("sidebar");
    var backdrop = document.getElementById("mobileMenuBackdrop");

    function closeMenu() {
      if (!sidebar) return;
      sidebar.classList.remove("open");
      document.body.classList.remove("mobile-menu-open");
      if (backdrop) {
        backdrop.classList.remove("open");
        backdrop.setAttribute("aria-hidden", "true");
      }
      if (mobileMenu) {
        mobileMenu.textContent = "☰";
        mobileMenu.setAttribute("aria-label", "Открыть меню");
      }
    }

    if (mobileMenu) {
      mobileMenu.onclick = function (event) {
        event.preventDefault();
        var open = !sidebar.classList.contains("open");
        sidebar.classList.toggle("open", open);
        document.body.classList.toggle("mobile-menu-open", open);
        if (backdrop) {
          backdrop.classList.toggle("open", open);
          backdrop.setAttribute("aria-hidden", open ? "false" : "true");
        }
        mobileMenu.textContent = open ? "×" : "☰";
        mobileMenu.setAttribute("aria-label", open ? "Закрыть меню" : "Открыть меню");
      };
    }

    if (backdrop) backdrop.onclick = closeMenu;
    sidebar.querySelectorAll("a").forEach(function (link) {
      link.onclick = closeMenu;
    });

    // Reset stale mobile-menu state when this page is restored from browser cache.
    window.addEventListener("pageshow", function () { closeMenu(); }, { once: true });


    renderCreateFields(state.headers);
    var count = document.getElementById("adminGoogleCount");
    if (count) count.textContent = "Форма готова";

    if (heartbeat) clearInterval(heartbeat);
    heartbeat = setInterval(function () {
      if (document.visibilityState === "hidden") return;
      var current = readSession();
      if (!current) {
        goLogin();
        return;
      }
      if (window.BR_API && typeof window.BR_API.me === "function") {
        window.BR_API.me(current.user.token).catch(function () {});
      }
    }, 30000);

  }

  function boot() {
    var session = readSession();

    if (!session || !session.user) {
      goLogin();
      return;
    }

    renderShell(session.user);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }
})();
</script>
</body>
</html>
