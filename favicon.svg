<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181b22"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff465b"/>
      <stop offset="1" stop-color="#d91832"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="18" y="18" width="476" height="476" rx="92" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="86" fill="none" stroke="#ff334b" stroke-width="10" filter="url(#glow)"/>
  <g filter="url(#shadow)" font-family="Arial,Helvetica,sans-serif" font-weight="900">
    <text x="145" y="275" text-anchor="middle" font-size="185" fill="#f4f5f7">B</text>
    <text x="337" y="275" text-anchor="middle" font-size="185" fill="url(#r)">R</text>
  </g>
  <path d="M218 102 L267 156 L218 210 L187 179 L210 156 L187 133 Z" fill="#0b0d12" opacity=".9"/>
  <text x="256" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="900" letter-spacing="2" fill="#ffffff">BLACK <tspan fill="#ff334b">RUSSIA</tspan></text>
  <rect x="108" y="395" width="72" height="6" rx="3" fill="#ff334b"/>
  <text x="256" y="408" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="9" fill="#aab0ba">ADMIN TOOLS</text>
  <rect x="332" y="395" width="72" height="6" rx="3" fill="#ff334b"/>
</svg>