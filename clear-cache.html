<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://frwajpwzurzokkvhntdl.supabase.co; connect-src 'self' https://frwajpwzurzokkvhntdl.supabase.co; object-src 'none'; base-uri 'none'">
<title>Обновление панели</title></head>
<body style="margin:0;background:#080a0f;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh"><div style="text-align:center"><h2>Обновление панели…</h2><p style="color:#8992a2">Кэш очищается автоматически.</p></div><script>
(async function(){
try{
if("serviceWorker" in navigator){var rs=await navigator.serviceWorker.getRegistrations();for(var i=0;i<rs.length;i++)await rs[i].unregister();}
if("caches" in window){var ks=await caches.keys();for(var j=0;j<ks.length;j++)await caches.delete(ks[j]);}try{localStorage.removeItem("br_session");sessionStorage.removeItem("br_session");document.cookie="br_session=; Max-Age=0; Path=/; Secure; SameSite=Lax";}catch(e){}
}catch(e){}
setTimeout(function(){location.replace("./?br_refresh="+Date.now());},300);
})();
</script></body>
</html>
